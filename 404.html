<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>페이지를 찾을 수 없습니다 · 커버 연습실</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F1115">
<style>
:root{--bg:#F6F7F9;--surface:#FFFFFF;--border:#D5D9E2;--control-border:#767F91;--text:#1B1F29;--text-muted:#566074;--accent:#0B6BCB;--on-accent:#FFFFFF;--body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0F1115;--surface:#171A21;--border:#2C313D;--control-border:#77808F;--text:#E8EAF0;--text-muted:#9AA3B2;--accent:#5CB8FF;--on-accent:#06121F;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.6;padding:16px;box-sizing:border-box}
main{max-width:420px;text-align:center}
h1{font-size:1.4rem;margin:.3rem 0}
p{color:var(--text-muted);margin:.4rem 0 1.2rem}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 1.1rem;border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:700;text-decoration:none;border:1px solid var(--accent)}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
a.t{display:inline-block;margin-top:1rem;color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>페이지를 찾을 수 없습니다</h1>
<p>주소가 바뀌었거나 없는 페이지입니다.</p>
<a class="btn" href="https://marty0215.github.io/cover-practice-room/">커버 연습실로 가기</a><br>
<a class="t" href="https://marty0215.github.io/cover-practice-room/help.html">사용 설명서</a>
</main>
</body>
</html>
